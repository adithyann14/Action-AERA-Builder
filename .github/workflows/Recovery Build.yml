name: Build AERA sky

on:
  workflow_dispatch:
    inputs:
      device_tree_url:
        description: "Device tree repository"
        required: true
        default: https://github.com/Adithy4n/recovery_device_xiaomi_sky.git
        type: string

      device_tree_branch:
        description: "Device tree branch"
        required: true
        default: fox_16.0
        type: string

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write

    env:
      SYNC_URL: https://github.com/AERA-Recovery/android_manifest.git
      MANIFEST_BRANCH: "aera-16.0"
      SRC_DIR: aera
      DEVICE_TREE_URL: ${{ inputs.device_tree_url }}
      DEVICE_TREE_BRANCH: ${{ inputs.device_tree_branch }}
      DEVICE_TREE_WEB: https://github.com/Adithy4n/recovery_device_xiaomi_sky
      DEVICE_PATH: device/xiaomi/sky
      DEVICE_NAME: sky
      MAKEFILE_NAME: twrp_sky-bp2a-eng
      BUILD_TARGET: recovery
      TZ: Asia/Kolkata

    steps:
    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Prepare the build environment
      run: |
        sudo apt-get update
        DEBIAN_FRONTEND=noninteractive sudo apt-get install -yq \
          git python3 tar aria2 ccache
        DEBIAN_FRONTEND=noninteractive sudo apt-get install -yq \
          linux-modules-extra-$(uname -r) || \
          echo "linux-modules-extra-$(uname -r) unavailable; continuing without it"
        curl -fL -O "https://gitlab.com/OrangeFox/misc/scripts/-/raw/master/setup/android_build_env.sh"
        sudo bash android_build_env.sh

    - name: Install OpenJDK
      uses: actions/setup-java@v6
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Sync AERA sources
      run: |
        mkdir -p "$GITHUB_WORKSPACE/${{ env.SRC_DIR }}"
        cd "$GITHUB_WORKSPACE/${{ env.SRC_DIR }}"
        repo init --depth=1 -u ${{ env.SYNC_URL }} -b ${{ env.MANIFEST_BRANCH }}
        repo sync -c --force-sync --no-clone-bundle --no-tags -j$(nproc)

    - name: AERA - blank screen on boot only for non-NVT panels
      run: |
        # TW_SCREEN_BLANK_ON_BOOT (gui/gui.cpp, gui_init) blanks and unblanks
        # the panel at recovery start. FTS panels (m19_42_*) need that, but on
        # NVT panels (m19_36_*) it collides with the touch-FW load and breaks
        # the display. Keep the flag true in BoardConfig; skip the cycle at
        # runtime when an NVT panel is detected:
        #   1) /proc/cmdline msm_drm.dsi_display0=...m19_36 / m19_42...
        #   2) fallback: /proc/NVTSPI or /proc/nvt_fw_version exists
        python3 - <<'PY'
        import re, sys
        from pathlib import Path

        f = Path("${{ env.SRC_DIR }}/bootable/recovery/gui/gui.cpp")
        s = f.read_text()
        if "AERA_NVT_BLANK_ON_BOOT_PATCH" in s:
            sys.exit(0)

        helper = '''/* AERA_NVT_BLANK_ON_BOOT_PATCH */
        static bool aera_panel_is_nvt(void)
        {
        	char b[4096] = {0};
        	FILE *f = fopen("/proc/cmdline", "r");
        	if (f) {
        		size_t n = fread(b, 1, sizeof(b) - 1, f);
        		b[n] = 0;
        		fclose(f);
        		if (strstr(b, "m19_36") || strstr(b, "n19_36"))
        			return true;
        		if (strstr(b, "m19_42") || strstr(b, "n19_42"))
        			return false;
        	}
        	return access("/proc/NVTSPI", F_OK) == 0 ||
        		access("/proc/nvt_fw_version", F_OK) == 0;
        }

        '''

        # 1) helper right before gui_init
        anchor = 'extern "C" int gui_init(void)'
        if s.count(anchor) != 1:
            sys.exit("::error::gui_init anchor not found exactly once in AERA gui.cpp")
        s = s.replace(anchor, helper + anchor, 1)

        # 2) wrap the blank/unblank cycle
        pat = re.compile(
            r'(#ifdef TW_SCREEN_BLANK_ON_BOOT\s*\n)'
            r'(\s*printf\("TW_SCREEN_BLANK_ON_BOOT := true\\n"\);\s*\n)'
            r'(\s*blankTimer\.blank\(\);\s*\n)'
            r'(\s*blankTimer\.resetTimerAndUnblank\(\);\s*\n)'
            r'(#endif)')
        m = pat.search(s)
        if not m:
            print("lines mentioning the flag in AERA gui.cpp:")
            for i, l in enumerate(s.split("\n"), 1):
                if "BLANK_ON_BOOT" in l or "blankTimer" in l:
                    print(f"  {i}: {l}")
            sys.exit("::error::TW_SCREEN_BLANK_ON_BOOT block in gui_init differs in AERA, update the patch")
        new = (m.group(1) +
               "\tif (aera_panel_is_nvt()) {\n"
               "\t\tprintf(\"NVT panel detected, skipping blank-on-boot\\n\");\n"
               "\t} else {\n"
               "\t\tprintf(\"TW_SCREEN_BLANK_ON_BOOT := true\\n\");\n"
               "\t\tblankTimer.blank();\n"
               "\t\tblankTimer.resetTimerAndUnblank();\n"
               "\t}\n" + m.group(5))
        s = s[:m.start()] + new + s[m.end():]
        f.write_text(s)
        print("patched", f)
        PY
        grep -n -B2 -A12 "aera_panel_is_nvt()" "${{ env.SRC_DIR }}/bootable/recovery/gui/gui.cpp"

    - name: Get bootable/recovery commit
      id: recovery_commit
      run: |
        cd "${{ env.SRC_DIR }}/bootable/recovery"
        COMMIT=$(git rev-parse --short=7 HEAD)
        echo "commit=$COMMIT" >> $GITHUB_OUTPUT
        echo "bootable/recovery: $COMMIT"

    - name: Clone device tree
      run: |
        git clone --depth=1 "${{ env.DEVICE_TREE_URL }}" \
          -b "${{ env.DEVICE_TREE_BRANCH }}" \
          "${{ env.SRC_DIR }}/${{ env.DEVICE_PATH }}"

    - name: Get device tree commit
      id: devtree_commit
      run: |
        cd "${{ env.SRC_DIR }}/${{ env.DEVICE_PATH }}"
        COMMIT=$(git rev-parse --short=7 HEAD)
        echo "commit=$COMMIT" >> $GITHUB_OUTPUT
        echo "device tree: $COMMIT"

    - name: Set swap space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 30

    - name: Show system resources
      run: |
        nproc && free -h && df -h

    - name: Build recovery
      timeout-minutes: 240
      run: |
        cd "${{ env.SRC_DIR }}"

        set +e
        source build/envsetup.sh
        set -e

        export ALLOW_MISSING_DEPENDENCIES=true
        lunch ${{ env.MAKEFILE_NAME }}

        mka adbd ${{ env.BUILD_TARGET }}image -j$(nproc --all)

    - name: Upload build logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          ${{ env.SRC_DIR }}/out/error.log
          ${{ env.SRC_DIR }}/out/verbose.log.gz
          ${{ env.SRC_DIR }}/out/soong.log
        if-no-files-found: ignore

    - name: Verify the flashable zip
      run: |
        set +e
        D="${{ env.SRC_DIR }}/out/target/product/${{ env.DEVICE_NAME }}"
        rc=0
        shopt -s nullglob
        for z in "$D"/AERA-R*.zip; do
          echo "### $(basename "$z"): $(stat -c%s "$z") bytes"
          if unzip -t "$z" > /tmp/zt.log 2>&1; then
            echo "### zip integrity: OK"
          else
            echo "### zip integrity: CORRUPT"
            tail -30 /tmp/zt.log
            rc=1
          fi
          ( cd "$(dirname "$z")" && md5sum "$(basename "$z")" | tee "$(basename "$z").md5" )
        done
        [ $rc -eq 0 ] || { echo "Flashable zip failed unzip -t"; exit 1; }

    - name: Check the output directory
      run: ls -l "${{ env.SRC_DIR }}/out/target/product/${{ env.DEVICE_NAME }}/"

    - name: Upload to release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          ${{ env.SRC_DIR }}/out/target/product/${{ env.DEVICE_NAME }}/AERA-R*.img
          ${{ env.SRC_DIR }}/out/target/product/${{ env.DEVICE_NAME }}/AERA-R*.zip
          ${{ env.SRC_DIR }}/out/target/product/${{ env.DEVICE_NAME }}/AERA-R*.zip.md5
        fail_on_unmatched_files: false
        name: ${{ env.DEVICE_NAME }}-${{ env.DEVICE_TREE_BRANCH }}-${{ steps.devtree_commit.outputs.commit }}
        tag_name: ${{ github.run_id }}
        body: |
          Manifest: ${{ env.MANIFEST_BRANCH }}
          Device: ${{ env.DEVICE_NAME }}
          Target: ${{ env.BUILD_TARGET }}
          Lunch: ${{ env.MAKEFILE_NAME }}
          Device tree branch: ${{ env.DEVICE_TREE_BRANCH }}
          Device tree commit: [${{ steps.devtree_commit.outputs.commit }}](${{ env.DEVICE_TREE_WEB }}/tree/${{ steps.devtree_commit.outputs.commit }})
          bootable/recovery commit: [${{ steps.recovery_commit.outputs.commit }}](https://github.com/AERA-Recovery/android_bootable_recovery/tree/${{ steps.recovery_commit.outputs.commit }})
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
